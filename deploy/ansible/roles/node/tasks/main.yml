---
- name: Check installed Node.js major version
  ansible.builtin.command: node --version
  register: node_installed
  changed_when: false
  failed_when: false

- name: Install Node.js from NodeSource
  when: node_installed.rc != 0 or not node_installed.stdout.startswith('v' ~ node_major)
  block:
    - name: Download NodeSource setup script
      ansible.builtin.get_url:
        url: "https://deb.nodesource.com/setup_{{ node_major }}.x"
        dest: /tmp/nodesource_setup.sh
        mode: "0755"

    - name: Run NodeSource setup script
      ansible.builtin.command: bash /tmp/nodesource_setup.sh
      changed_when: true

    - name: Install nodejs
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: true
