---
- name: Ensure web root parent exists
  ansible.builtin.file:
    path: "{{ app_dir | dirname }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"

- name: Ensure app directory exists and is owned by deploy user
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"

# ── Доставка кода: git ИЛИ пуш локальных файлов (без git) ──────────────────────
- name: Checkout application code (git)
  when: deploy_method == 'git'
  become: true
  become_user: "{{ deploy_user }}"
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "{{ app_dir }}"
    version: "{{ app_version }}"
    force: true
    accept_hostkey: true
  notify:
    - Reload php-fpm
    - Restart queue worker

- name: Push local project (no git)
  when: deploy_method == 'local'
  block:
    - name: Pack project into an archive on the control machine
      delegate_to: localhost
      become: false
      run_once: true
      ansible.builtin.command:
        cmd: >-
          tar -czf {{ local_archive }} -C {{ project_src }}
          --exclude='./.git'
          --exclude='./node_modules'
          --exclude='./.env'
          --exclude='./deploy'
          --exclude='./public/hot'
          --exclude='./public/storage'
          --exclude='./storage/logs/*.log'
          --exclude='./storage/framework/testing'
          --exclude='./bootstrap/cache/*.php'
          --exclude='./.phpunit.result.cache'
          --exclude='./.DS_Store'
          {{ "" if build_locally else "--exclude=./vendor --exclude=./public/build" }}
          .
      changed_when: true

    - name: Upload and extract project onto the server
      ansible.builtin.unarchive:
        src: "{{ local_archive }}"
        dest: "{{ app_dir }}"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
      notify:
        - Reload php-fpm
        - Restart queue worker

    - name: Remove local archive
      delegate_to: localhost
      become: false
      run_once: true
      ansible.builtin.file:
        path: "{{ local_archive }}"
        state: absent

# ── APP_KEY: не перезатираем уже сгенерированный ключ ──────────────────────────
- name: Check for existing .env
  ansible.builtin.stat:
    path: "{{ app_dir }}/.env"
  register: env_file

- name: Read existing .env
  ansible.builtin.slurp:
    src: "{{ app_dir }}/.env"
  register: env_content
  when: env_file.stat.exists

- name: Extract existing APP_KEY
  ansible.builtin.set_fact:
    existing_app_key: >-
      {{ (env_content.content | b64decode).splitlines()
         | select('match', '^APP_KEY=') | list | first | default('')
         | regex_replace('^APP_KEY=', '') | trim }}
  when: env_file.stat.exists

- name: Decide effective APP_KEY (vault > existing > empty)
  ansible.builtin.set_fact:
    effective_app_key: "{{ app_key if (app_key | length > 0) else (existing_app_key | default('')) }}"

- name: Write .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0640"
  notify:
    - Reload php-fpm
    - Restart queue worker

# build_locally: true → vendor/ и public/build залиты с управляющей машины,
# на сервере composer/npm не запускаем (актуально, если сервер отрезан от GitHub).
- name: Install PHP dependencies (production)
  when: not build_locally
  become: true
  become_user: "{{ deploy_user }}"
  ansible.builtin.command:
    cmd: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
    chdir: "{{ app_dir }}"
  environment:
    COMPOSER_ALLOW_SUPERUSER: "0"
  changed_when: true

- name: Generate APP_KEY on first deploy (when none set)
  become: true
  become_user: "{{ deploy_user }}"
  ansible.builtin.command:
    cmd: php artisan key:generate --force
    chdir: "{{ app_dir }}"
  when: effective_app_key | length == 0
  changed_when: true

- name: Install JS dependencies
  when: not build_locally
  become: true
  become_user: "{{ deploy_user }}"
  ansible.builtin.command:
    cmd: npm ci
    chdir: "{{ app_dir }}"
  changed_when: true

- name: Build frontend assets
  when: not build_locally
  become: true
  become_user: "{{ deploy_user }}"
  ansible.builtin.command:
    cmd: npm run build
    chdir: "{{ app_dir }}"
  changed_when: true

- name: Link storage to public
  become: true
  become_user: "{{ deploy_user }}"
  ansible.builtin.command:
    cmd: php artisan storage:link
    chdir: "{{ app_dir }}"
    creates: "{{ app_dir }}/public/storage"

- name: Run database migrations
  become: true
  become_user: "{{ deploy_user }}"
  ansible.builtin.command:
    cmd: php artisan migrate --force
    chdir: "{{ app_dir }}"
  register: migrate_result
  changed_when: "'Nothing to migrate' not in migrate_result.stdout"

- name: Cache configuration, routes and views
  become: true
  become_user: "{{ deploy_user }}"
  ansible.builtin.command:
    cmd: "php artisan {{ item }}"
    chdir: "{{ app_dir }}"
  loop:
    - config:cache
    - route:cache
    - view:cache
  changed_when: true

- name: Ensure storage and cache are writable
  ansible.builtin.file:
    path: "{{ app_dir }}/{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    recurse: true
  loop:
    - storage
    - bootstrap/cache
