---
- name: Set timezone
  ansible.builtin.timezone:
    name: "{{ app_timezone }}"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - git
      - curl
      - unzip
      - ca-certificates
      - acl            # нужно для become на непривилегированного пользователя
      - gnupg
    state: present

- name: Create deploy group
  ansible.builtin.group:
    name: "{{ deploy_user }}"
    state: present

- name: Create deploy user
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    shell: /bin/bash
    home: "/home/{{ deploy_user }}"
    create_home: true
    state: present

# ── Firewall (опционально, без внешних коллекций — через сам ufw) ──────────────
- name: Configure firewall (ufw)
  when: configure_firewall | bool
  block:
    - name: Install ufw
      ansible.builtin.apt:
        name: ufw
        state: present

    - name: Allow required ports
      ansible.builtin.command: "ufw allow {{ item }}"
      loop:
        - "{{ ssh_port }}/tcp"
        - "80/tcp"
        - "443/tcp"
      register: ufw_allow
      changed_when: "'Rule added' in ufw_allow.stdout or 'Rules updated' in ufw_allow.stdout"

    - name: Enable ufw
      ansible.builtin.command: "ufw --force enable"
      register: ufw_enable
      changed_when: "'active' in ufw_enable.stdout"
