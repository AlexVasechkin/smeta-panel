---
- name: Set timezone
  ansible.builtin.timezone:
    name: "{{ app_timezone }}"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - git
      - curl
      - unzip
      - ca-certificates
      - acl            # нужно для become на непривилегированного пользователя
      - gnupg
    state: present

- name: Create deploy group
  ansible.builtin.group:
    name: "{{ deploy_user }}"
    state: present

- name: Create deploy user
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    shell: /bin/bash
    home: "/home/{{ deploy_user }}"
    create_home: true
    state: present

# Firewall не настраивается Ansible-плейбуком: на этом сервере SSH проброшен
# на нестандартный внешний порт, и управление ufw приводило к блокировке доступа.
# Открытие портов (80/443 и SSH) выполняется на стороне провайдера/сервера.
