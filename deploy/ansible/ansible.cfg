[defaults]
inventory = inventory.ini
roles_path = roles
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
timeout = 60

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
# Устойчивость к медленному SSH-баннеру и переиспользование соединения.
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=15 -o ServerAliveCountMax=6 -o ConnectTimeout=60
retries = 3
pipelining = True
