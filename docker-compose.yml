services:
  postgres:
    image: postgres:17-alpine
    container_name: remont_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-remont}
      POSTGRES_USER: ${DB_USERNAME:-remont}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-remont} -d ${DB_DATABASE:-remont}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
    driver: local
